services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: agent_memory
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
