# Checks every push: the Python suite (as in CLAUDE.md "Commands") and the web frontend.
# No Ollama, Postgres or voice engines here; the tests that need them skip themselves.
name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # Windows like the dev machine: voice uses ctypes WinDLL, pyright is found in .venv\Scripts.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install ripgrep (search_code tests)
        run: choco install ripgrep --no-progress -y

      - name: Create .venv and install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt pyright==1.1.414

      - name: Build the web frontend (tests check webui/dist)
        run: |
          npm --prefix webui ci
          npm --prefix webui run build

      - name: Unit tests
        run: .venv\Scripts\python -m unittest discover -s tests -t .

  webui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
