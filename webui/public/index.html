<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Coding assistant</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar" aria-label="Sessions">
    <div class="sidebar-head">
      <h1>Coding assistant</h1>
      <button id="new-session" type="button" class="primary">New session</button>
    </div>
    <nav>
      <ul id="sessions" class="sessions"></ul>
    </nav>
  </aside>

  <div class="chat">
    <header class="bar">
      <button id="toggle-sidebar" type="button" class="quiet narrow-only" aria-controls="sidebar" aria-expanded="false">Sessions</button>
      <h2 id="session-title" class="title"></h2>
      <span id="status" class="status" role="status"></span>
      <div class="bar-actions">
        <button id="rename" type="button" class="quiet">Rename</button>
        <button id="clear-chat" type="button" class="quiet">Clear</button>
        <button id="delete-session" type="button" class="quiet danger">Delete</button>
      </div>
    </header>

    <main id="scroll" class="scroll">
      <p id="empty" class="empty">Ask about this project's code, or say what to change. The assistant asks before it runs a command or edits a file.</p>
      <div id="log" class="log" role="log"></div>
    </main>

    <p id="alert" class="alert" role="alert" hidden></p>

    <section id="approval" class="approval" role="alertdialog" aria-labelledby="approval-title" hidden>
      <h3 id="approval-title">The assistant wants to run</h3>
      <pre id="approval-calls"></pre>
      <div class="actions">
        <button id="deny" type="button" class="deny">Deny</button>
        <button id="allow" type="button" class="allow">Allow</button>
      </div>
    </section>

    <form id="form" class="composer" autocomplete="off">
      <label class="sr" for="input">Message</label>
      <textarea id="input" rows="1" placeholder="Message the assistant" enterkeyhint="send"></textarea>
      <button id="stop" type="button" class="quiet" disabled>Stop</button>
      <button id="send" type="submit" class="primary">Send</button>
    </form>
  </div>
</div>

<script type="module" src="/main.js"></script>
</body>
</html>
